name: Apply fast widget AE warmup

on:
  push:
    branches: [test-1.8.131-clean-all-fps-fast-widget-ae]
    paths:
      - '.github/workflows/apply-fast-widget-ae-warmup.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-clean-all-fps-fast-widget-ae
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fast widget AE warmup patch
        run: python3 tools/apply_fast_widget_ae_warmup.py

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit direct source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt app/build.gradle.kts
          git commit -m 'adiciona warmup rápido de AE para captura headless'
          git push origin HEAD:test-1.8.131-clean-all-fps-fast-widget-ae
