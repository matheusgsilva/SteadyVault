name: Remove 120 and 240 FPS

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/remove-high-fps.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove high FPS modes
        run: |
          python3 tools/disable_high_speed_preview.py
          python3 tools/remove_high_fps.py
          python3 tools/restore_select_best.py

      - name: Verify 30 and 60 only
        run: |
          grep -F 'private val SUPPORTED_FPS = linkedSetOf(30, 60)' app/src/main/java/com/steadyvault/camera/core/settings/CaptureSettings.kt
          ! grep -R -n -E 'FPS_120|FPS_240|fps120Button|fps240Button|previewFps120Button|previewFps240Button' app/src/main/java app/src/main/res
          ! grep -R -n -E '120 FPS|240 FPS' app/src/main/java/com/steadyvault/camera/capture app/src/main/java/com/steadyvault/camera/ui/capture app/src/main/java/com/steadyvault/camera/ui/settings app/src/main/res/layout/activity_capture.xml
          test ! -e app/src/main/java/com/steadyvault/camera/capture/recorder/HighSpeedTimestampNormalizer.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated removal
        run: |
          rm -f .github/workflows/remove-high-fps.yml tools/remove_high_fps.py tools/disable_high_speed_preview.py tools/restore_select_best.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'remove modos 120 e 240 fps e mantem 30 e 60'
          git push origin HEAD:test-1.8.131-motion-gap-repair
