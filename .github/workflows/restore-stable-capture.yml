name: Restore stable capture

on:
  push:
    branches: [ test-1.8.131-motion-gap-repair ]
    paths:
      - 'tools/restore_stable_capture.py'
      - '.github/workflows/restore-stable-capture.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore known-good capture core
        shell: bash
        run: |
          git fetch origin test-1.8.131-ios-like-capture
          git show origin/test-1.8.131-ios-like-capture:app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt > app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          python3 tools/restore_stable_capture.py
      - name: Verify capture isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt').read_text()
          assert 'profile.targetFps == CaptureModeStore.FPS_60' in p
          assert 'startWithFixedSensorCadence(session, request, profile, token)' in p
          assert 'AutoGapRepairService.pauseForCapture(this)' in p
          assert 'VideoOptimizationService.pauseForCapture(this)' in p
          assert 'AutoGapRepairService.enqueue(this, finalFile, fps)' in p
          # Later experimental HFR camera-switch code must not leak back into stable core.
          assert 'selectAlternateHighFpsConfiguration' not in p
          assert 'HighFpsCadenceValidator' not in p
          print('capture core matches stable branch plus isolated processing hooks')
          PY
      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon
      - name: Commit validated app changes and cleanup
        shell: bash
        run: |
          rm -f tools/restore_stable_capture.py .github/workflows/restore-stable-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'restaura captura lisa e isola processamento'
            git push origin HEAD:test-1.8.131-motion-gap-repair
          fi
