name: Apply robust capture processing

on:
  push:
    branches: [test-1.8.131-ios-like-robust-processing]

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-ios-like-robust-processing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply robust patch
        run: python3 tools/apply_robust_capture_processing.py
      - name: Static audit
        run: |
          grep -q 'versionCode = 1000144' app/build.gradle.kts
          grep -q 'AutoGapRepairService.pauseForCapture' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'AutoGapRepairService.enqueue' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'val targetSpeed = 1f' app/src/main/java/com/steadyvault/camera/ui/vault/MediaPlayerActivity.kt
          grep -q 'colorProfile.isEnabled = !hdr.isChecked && !highSpeed' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'AutoGapRepairService' app/src/main/AndroidManifest.xml
          git diff --check
      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit direct source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app
          if ! git diff --cached --quiet; then
            git commit -m 'corrige high speed e adiciona reparo automatico robusto'
            git push origin HEAD:test-1.8.131-ios-like-robust-processing
          fi
