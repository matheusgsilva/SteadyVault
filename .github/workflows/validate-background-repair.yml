name: Validate background repair lifecycle

on:
  push:
    branches: [ test-1.8.131-motion-gap-repair ]
    paths:
      - 'tools/apply_background_repair_lifecycle.py'
      - '.github/workflows/validate-background-repair.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply lifecycle fix
        run: python3 tools/apply_background_repair_lifecycle.py
      - name: Static lifecycle audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          auto = Path('app/src/main/java/com/steadyvault/camera/processing/auto/AutoGapRepairService.kt').read_text()
          app = Path('app/src/main/java/com/steadyvault/camera/SteadyVaultApplication.kt').read_text()
          capture = Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt').read_text()
          manual = Path('app/src/main/java/com/steadyvault/camera/processing/service/VideoOptimizationService.kt').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          settings = Path('app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt').read_text()
          checks = {
              'known-good 60 cadence path retained': 'profile.targetFps == CaptureModeStore.FPS_60' in capture and 'startWithFixedSensorCadence(session, request, profile, token)' in capture,
              'experimental HFR selector removed from capture': 'selectAlternateHighFpsConfiguration' not in capture,
              'auto repair yields to capture': 'AutoGapRepairService.pauseForCapture(this)' in capture,
              'manual optimization yields to capture': 'VideoOptimizationService.pauseForCapture(this)' in capture and 'capturePriorityRequested' in manual,
              'auto repair yields to foreground UI': 'interactivePriorityRequested' in auto and 'pauseForInteractiveUse()' in app,
              'auto repair resumes in background': 'resumeForBackground(this)' in app,
              'auto repair resumes on screen off': 'retomar reparo com tela apagada' in app,
              'foreground UI does not auto-start repair at process startup': '"retomar reparo automatico"' not in app,
              'wake lock permission exists': 'android.permission.WAKE_LOCK' in manifest,
              'auto service survives task removal': 'android:name=".processing.auto.AutoGapRepairService"' in manifest and 'android:stopWithTask="false"' in manifest,
              'manual service survives task removal': 'android:name=".processing.service.VideoOptimizationService"' in manifest,
              'settings explain background policy': 'reparo automático fica pausado enquanto você navega' in settings,
          }
          bad = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('OK   ' if ok else 'FAIL ') + name)
          if bad: raise SystemExit('Lifecycle audit failed: ' + ', '.join(bad))
          PY
      - name: Compile and assemble APK
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace
      - name: Commit validated app changes and cleanup
        shell: bash
        run: |
          rm -f tools/apply_background_repair_lifecycle.py .github/workflows/validate-background-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'estabiliza reparo automatico em segundo plano'
          git push origin HEAD:test-1.8.131-motion-gap-repair
