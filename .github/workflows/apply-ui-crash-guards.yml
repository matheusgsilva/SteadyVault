name: Apply UI crash guards

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'prepara aplicacao da protecao de UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply crash guards
        run: python3 tools/apply_ui_crash_guards.py
      - name: Static guard audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rebuildSettingsSafely("abertura")' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'showSettingsRecovery' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'formReady && !building' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'runUiAction("botao:' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'toIntOrNull()' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          grep -q 'AppLogRepository.error(activity, "NAVIGATION"' app/src/main/java/com/steadyvault/camera/ui/navigation/BottomNavigation.kt
          grep -q 'versionCode = 1000148' app/build.gradle.kts
      - name: Compile and assemble
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace
      - name: Commit app changes
        shell: bash
        run: |
          git config user.name 'matheusgsilva'
          git config user.email '49157527+matheusgsilva@users.noreply.github.com'
          git add app
          git commit -m 'protege ajustes e navegacao contra crashes de UI'
          git push origin HEAD:test-1.8.131-motion-gap-repair
