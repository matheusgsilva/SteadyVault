name: Android branch validation

on:
  push:
    branches:
      - fix/s25-ultra-gap-free-capture
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SteadyVault-s25-gap-free-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
