name: Apply clean all fps

on:
  push:
    branches: [test-1.8.131-clean-all-fps]
    paths:
      - '.github/workflows/apply-clean-all-fps.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-clean-all-fps
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply clean all FPS patch
        run: python3 tools/apply_clean_all_fps.py

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit direct source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt app/src/main/java/com/steadyvault/camera/capture/timing/SensorCadencePolicy.kt app/build.gradle.kts
          git commit -m 'aplica lógica clean aos FPS regulares'
          git push origin HEAD:test-1.8.131-clean-all-fps
