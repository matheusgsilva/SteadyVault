name: Audit recording routes and settings

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply route and settings fixes
        shell: bash
        run: |
          python3 tools/apply_route_settings_audit.py
          python3 tools/patch_hide_processing_labels.py
          python3 tools/patch_route_settings_followup.py

      - name: Static route audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = {
              'router': Path('app/src/main/java/com/steadyvault/camera/capture/service/RecordingServiceRouter.kt').read_text(),
              'widget': Path('app/src/main/java/com/steadyvault/camera/widgets/WidgetStartReceiver.kt').read_text(),
              'black': Path('app/src/main/java/com/steadyvault/camera/ui/capture/DiscreetRecordingActivity.kt').read_text(),
              'capture': Path('app/src/main/java/com/steadyvault/camera/ui/capture/CaptureActivity.kt').read_text(),
              'service': Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt').read_text(),
              'settings': Path('app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt').read_text(),
          }
          checks = [
              ('widget effective profile', 'RecordingServiceRouter.effectiveSettings(context, fps)' in files['widget']),
              ('widget reads current FPS at tap', 'intent.getIntExtra(\n            EXTRA_TARGET_FPS' not in files['widget']),
              ('black widget effective profile', 'RecordingServiceRouter.effectiveSettings(this, targetFps)' in files['black']),
              ('black widget storage preflight', 'RecordingStorageGuard.checkProfile(this, effectiveSettings)' in files['black']),
              ('home screen routed', 'RecordingServiceRouter.start(' in files['capture'] and 'RecordingServiceRouter.startHeadless(' in files['capture']),
              ('per-fps resolution routed', 'CaptureSettings.resolutionForFps(context, safeFps)' in files['router']),
              ('manual optimization cancelled centrally', 'cancelManualOptimizationIfRunning(context)' in files['router']),
              ('automatic repair paused by capture service', 'AutoGapRepairService.pauseForCapture(this)' in files['service']),
              ('automatic repair resumed after capture', 'AutoGapRepairService.resumeAfterCapture(this)' in files['service']),
              ('dead iframe UI removed', 'Intervalo entre quadros-chave (I-frame)' not in files['settings']),
              ('dead audio UI removed', 'Controle automático de ganho do microfone' not in files['settings']),
              ('single-option preview removed', 'Visualização da câmera antes de capturar' not in files['settings'] and 'previewMode' not in files['settings']),
              ('60fps fixed processing explained', 'Em 60, 120 e 240 FPS' in files['settings']),
          ]
          bad = [name for name, ok in checks if not ok]
          for name, ok in checks:
              print(('OK   ' if ok else 'FAIL ') + name)
          if bad:
              raise SystemExit('falhas: ' + ', '.join(bad))
          PY

      - name: Compile and assemble APK
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Runtime smoke for routing and settings
        shell: bash
        run: |
          cp app/build.gradle.kts /tmp/steadyvault-build.gradle.kts
          if [ -d app/src/test/java ]; then mv app/src/test/java /tmp/steadyvault-existing-tests; fi
          cat >> app/build.gradle.kts <<'EOF'

          android {
              testOptions {
                  unitTests.isIncludeAndroidResources = true
              }
          }

          dependencies {
              testImplementation("org.robolectric:robolectric:4.16.1")
          }
          EOF
          mkdir -p app/src/test/java/com/steadyvault/camera/audit
          cat > app/src/test/java/com/steadyvault/camera/audit/RecordingFlowSettingsAuditTest.kt <<'EOF'
          package com.steadyvault.camera.audit

          import android.content.Context
          import android.content.Intent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import com.steadyvault.camera.R
          import com.steadyvault.camera.capture.service.CaptureService
          import com.steadyvault.camera.capture.service.RecordingServiceRouter
          import com.steadyvault.camera.core.settings.CaptureSettings
          import com.steadyvault.camera.ui.settings.SettingsActivity
          import org.junit.After
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.Robolectric
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.RuntimeEnvironment
          import org.robolectric.annotation.Config

          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [35])
          class RecordingFlowSettingsAuditTest {
              private val context: Context get() = RuntimeEnvironment.getApplication()

              @After
              fun cleanup() {
                  listOf(
                      "steadyvault_capture_settings",
                      "steadyvault_camera_profiles",
                      "steadyvault_hardware_capabilities",
                      "steadyvault_playback_settings"
                  ).forEach { name ->
                      context.getSharedPreferences(name, Context.MODE_PRIVATE).edit().clear().commit()
                  }
              }

              @Test
              fun requestedFpsUsesItsOwnSavedResolution() {
                  CaptureSettings.saveResolutionForFps(context, 60, CaptureSettings.RESOLUTION_4K)
                  CaptureSettings.saveResolutionForFps(context, 120, CaptureSettings.RESOLUTION_1080P)
                  val effective = RecordingServiceRouter.effectiveSettings(context, 120)
                  assertEquals(120, effective.fps)
                  assertEquals(CaptureSettings.RESOLUTION_1080P, effective.resolution)
              }

              @Test
              fun headlessIntentCannotAccidentallyCarryPreviewSurface() {
                  val intent = RecordingServiceRouter.startIntent(
                      context = context,
                      targetFps = 120,
                      fromPreview = true,
                      headless = true
                  )
                  assertEquals(CaptureService.ACTION_START, intent.action)
                  assertEquals(120, intent.getIntExtra(CaptureService.EXTRA_TARGET_FPS, 0))
                  assertTrue(intent.getBooleanExtra(CaptureService.EXTRA_HEADLESS_CAPTURE, false))
                  assertFalse(intent.getBooleanExtra(CaptureService.EXTRA_FROM_PREVIEW, true))
              }

              @Test
              fun settingsShowsOnlyControlsThatHaveEffectInDirectPipeline() {
                  CaptureSettings.updateResolutionAndFps(context, CaptureSettings.RESOLUTION_4K, 60)
                  val controller = Robolectric.buildActivity(
                      SettingsActivity::class.java,
                      Intent(context, SettingsActivity::class.java)
                  ).create().start().resume().visible()
                  val activity = controller.get()
                  assertFalse(activity.isFinishing)
                  val root = activity.findViewById<ViewGroup>(R.id.settingsContainer)
                  val visibleTexts = mutableListOf<String>()
                  fun collect(view: View) {
                      if (view.visibility != View.VISIBLE) return
                      if (view is TextView) visibleTexts += view.text.toString()
                      if (view is ViewGroup) for (i in 0 until view.childCount) collect(view.getChildAt(i))
                  }
                  collect(root)
                  val all = visibleTexts.joinToString("\n")
                  assertFalse(all.contains("Intervalo entre quadros-chave (I-frame)"))
                  assertFalse(all.contains("Limite de ganho do microfone"))
                  assertFalse(all.contains("Controle automático de ganho do microfone"))
                  assertFalse(all.contains("Supressão de ruído do microfone"))
                  assertFalse(all.contains("Visualização da câmera antes de capturar"))
                  assertFalse(all.contains("Redução de ruído da imagem"))
                  assertFalse(all.contains("Nitidez da imagem"))
                  assertTrue(all.contains("Em 60, 120 e 240 FPS"))
                  assertTrue(all.contains("O áudio é gravado diretamente pelo MediaRecorder"))
                  controller.pause().stop().destroy()
              }
          }
          EOF
          bash ./gradlew :app:testDebugUnitTest --tests 'com.steadyvault.camera.audit.RecordingFlowSettingsAuditTest' --no-daemon --stacktrace
          cp /tmp/steadyvault-build.gradle.kts app/build.gradle.kts
          rm -rf app/src/test/java
          if [ -d /tmp/steadyvault-existing-tests ]; then mkdir -p app/src/test; mv /tmp/steadyvault-existing-tests app/src/test/java; fi

      - name: Commit validated app changes and remove temporary audit files
        shell: bash
        run: |
          rm -f tools/apply_route_settings_audit.py tools/patch_hide_processing_labels.py tools/patch_route_settings_followup.py
          rm -f .github/workflows/audit-routes-settings.yml
          rm -f .github/workflows/apply-test-fixes.yml
          rm -f .github/workflows/apply-ui-crash-guards.yml
          rm -f .github/workflows/audit-16kb-native.yml
          rm -f .github/workflows/smoke-settings-runtime.yml
          git config user.name "matheusgsilva"
          git config user.email "49157527+matheusgsilva@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "unifica rotas de gravacao e limpa ajustes sem efeito"
          git push origin HEAD:test-1.8.131-motion-gap-repair
