name: Apply HFR and vault polish

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply fixes
        run: python3 tools/apply_hfr_vault_polish.py
      - name: Static audit
        run: |
          grep -q 'setCaptureRate(targetFps.toDouble())' app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt
          grep -q 'HighFpsCadenceValidator.inspect' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'CaptureCapabilityMatrix.scan(applicationContext' app/src/main/java/com/steadyvault/camera/ui/capture/CaptureActivity.kt
          grep -q 'Original •' app/src/main/java/com/steadyvault/camera/ui/vault/PrimaryVaultActivity.kt
          grep -q 'AutoGapRepairQueueStore.runningJob' app/src/main/java/com/steadyvault/camera/ui/vault/PrimaryVaultActivity.kt
          grep -q 'MOTION_COMPENSATED' app/src/main/java/com/steadyvault/camera/ui/vault/VideoOptimizationActivity.kt
          if grep -Rni --include='*.kt' --include='*.xml' 'iphone' app/src/main; then exit 1; fi
      - name: Compile and assemble APK
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon
      - name: Commit app changes
        run: |
          git config user.name 'matheusgsilva'
          git config user.email '49157527+matheusgsilva@users.noreply.github.com'
          git add app
          git commit -m 'corrige HFR e progresso do processamento no cofre'
          git push origin HEAD:test-1.8.131-motion-gap-repair
