name: Patch HFR source pacing

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/patch-hfr-source-pacing.yml
      - tools/patch_hfr_source_pacing.py

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch HFR source
        run: |
          sed -i 's/direct_mediarecorder_v7_button_faststart/ios-like-ae-clean-1.8.257/g' tools/patch_hfr_source_pacing.py
          python3 tools/patch_hfr_source_pacing.py

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated patch
        run: |
          rm -f tools/patch_hfr_source_pacing.py .github/workflows/patch-hfr-source-pacing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'reduz gaps na origem do HFR'
          git push origin HEAD:test-1.8.131-motion-gap-repair
