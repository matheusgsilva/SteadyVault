name: Fix Instagram reel download

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-instagram-reel-download.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fix
        run: python3 tools/fix_instagram_reel_download.py

      - name: Verify scope
        run: |
          grep -F 'val query = if (isStoryUrl(trimmed)) uri.rawQuery else null' app/src/main/java/com/steadyvault/camera/ui/browser/InstagramPublicAccess.kt
          grep -F 'if (authenticated) {' app/src/main/java/com/steadyvault/camera/ui/browser/SocialMediaDownloader.kt
          grep -F 'val directFallback = { resolvePageMediaForDownload(pageUrl, direct, internalStream, scan.thumbnailUrl) }' app/src/main/java/com/steadyvault/camera/ui/browser/PrivateBrowserActivity.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/capture app/src/main/java/com/steadyvault/camera/processing)"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-instagram-reel-download.yml tools/fix_instagram_reel_download.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'corrige download de reels no navegador isolado'
          git push origin HEAD:test-1.8.131-motion-gap-repair
