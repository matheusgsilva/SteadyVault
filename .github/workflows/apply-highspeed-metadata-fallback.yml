name: Apply highspeed metadata fallback

on:
  push:
    branches: [test-1.8.131-highspeed-color-fix]
    paths:
      - '.github/workflows/apply-highspeed-metadata-fallback.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-highspeed-color-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply highspeed metadata fallback
        run: python3 tools/apply_highspeed_metadata_fallback.py

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit direct source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          git commit -m 'resolve resolução high-speed direto pelos metadados da câmera'
          git push origin HEAD:test-1.8.131-highspeed-color-fix
