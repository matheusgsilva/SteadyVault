name: Cleanup gradlew mode

on:
  push:
    branches:
      - test-1.8.131-optimization-lifecycle-fix
    paths:
      - .github/workflows/cleanup-gradlew-mode.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-optimization-lifecycle-fix
      - name: Restore wrapper mode and remove workflow
        run: |
          chmod -x gradlew
          rm -f .github/workflows/cleanup-gradlew-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restaura modo original do gradlew"
          git push origin HEAD:test-1.8.131-optimization-lifecycle-fix
