name: Apply highspeed and color fix

on:
  push:
    branches: [test-1.8.131-highspeed-color-fix]
    paths:
      - '.github/workflows/apply-highspeed-color-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-highspeed-color-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply highspeed and color patch
        run: |
          python3 tools/apply_highspeed_color_fix.py
          python3 tools/fix_highspeed_color_compile.py

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit direct source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt app/src/main/java/com/steadyvault/camera/core/capability/CaptureCapabilityMatrix.kt app/src/main/java/com/steadyvault/camera/core/capability/CaptureModeCatalog.kt app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt app/build.gradle.kts
          git commit -m 'corrige high-speed 120/240 e libera cor em 60 por capacidade'
          git push origin HEAD:test-1.8.131-highspeed-color-fix
