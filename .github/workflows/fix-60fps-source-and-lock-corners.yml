name: Fix 60 FPS source and lock corners

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-60fps-source-and-lock-corners.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore 60 FPS baseline and patch source pacing
        shell: bash
        run: |
          set -euo pipefail
          git checkout 1f00b49d9875d21a5438192b81669a3957d64a62 -- app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt
          python3 - <<'PY'
          from pathlib import Path
          recorder_path = Path('app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt')
          recorder = recorder_path.read_text()
          assert recorder.count('selectedProfile != null && (hdrHlg10 || targetFps >= 120)') == 1
          recorder = recorder.replace('selectedProfile != null && (hdrHlg10 || targetFps >= 120)', 'selectedProfile != null && (hdrHlg10 || targetFps >= 60)')
          assert recorder.count('oemProfile != null && (hdrHlg10 || targetFps >= 120)') == 1
          recorder = recorder.replace('oemProfile != null && (hdrHlg10 || targetFps >= 120)', 'oemProfile != null && (hdrHlg10 || targetFps >= 60)')
          recorder_path.write_text(recorder)
          capture_path = Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt')
          capture = capture_path.read_text()
          assert capture.count('ios-like-ae-clean-1.8.257') == 1
          capture = capture.replace('ios-like-ae-clean-1.8.257', 'ios-like-ae-clean-1.8.258-oem60')
          capture_path.write_text(capture)
          widget_path = Path('app/src/main/java/com/steadyvault/camera/widgets/WidgetAppearance.kt')
          widget = widget_path.read_text()
          assert widget.count('AppearanceStore.cornerRadiusDp(context) * 0.60f * density') == 1
          widget = widget.replace('AppearanceStore.cornerRadiusDp(context) * 0.60f * density', 'AppearanceStore.cornerRadiusDp(context) * density')
          widget_path.write_text(widget)
          analysis = Path('app/src/main/java/com/steadyvault/camera/processing/analysis/VideoAnalysis.kt').read_text()
          assert '(frameCount - 1L) * 1_000_000.0 / spanUs.toDouble()' in analysis
          assert 'sem promover 60 -> 120' in analysis
          PY

      - name: Verify repair code untouched
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          echo "$changed"
          unexpected=$(echo "$changed" | grep '^app/' | grep -Ev '^(app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt|app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt|app/src/main/java/com/steadyvault/camera/widgets/WidgetAppearance.kt)$' || true)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-60fps-source-and-lock-corners.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'corrige captura 60 fps e cantos do widget bloqueado'
          git push origin HEAD:test-1.8.131-motion-gap-repair
