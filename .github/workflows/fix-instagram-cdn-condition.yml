name: Fix Instagram CDN condition

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-instagram-cdn-condition.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/steadyvault/camera/ui/browser/BrowserVaultDownloader.kt')
          s = p.read_text()
          old = '''        return lower.startsWith("http://") || lower.startsWith("https://") &&\n            (lower.contains("cdninstagram.com") || lower.contains("fbcdn.net"))'''
          new = '''        return (lower.startsWith("http://") || lower.startsWith("https://")) &&\n            (lower.contains("cdninstagram.com") || lower.contains("fbcdn.net"))'''
          if s.count(old) != 1:
              raise SystemExit('expected one Instagram CDN condition')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F 'return (lower.startsWith("http://") || lower.startsWith("https://")) &&' app/src/main/java/com/steadyvault/camera/ui/browser/BrowserVaultDownloader.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/capture app/src/main/java/com/steadyvault/camera/processing)"
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit
        run: |
          rm -f .github/workflows/fix-instagram-cdn-condition.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'corrige filtro de CDN do Instagram'
          git push origin HEAD:test-1.8.131-motion-gap-repair
