name: Fix regular 120 FPS capture

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-regular-120-capture.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply regular 120 FPS fix
        run: python3 tools/fix_regular_120_capture.py

      - name: Verify scope
        run: |
          grep -F 'if (targetFps == CaptureModeStore.FPS_120) return exact' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -F 'ios-like-ae-auto60-1.8.261-regular120' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"
          changed="$(git diff --name-only | sort)"
          expected="app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt"
          test "$changed" = "$expected"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-regular-120-capture.yml tools/fix_regular_120_capture.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'prioriza sessao regular em 120 fps no S25'
          git push origin HEAD:test-1.8.131-motion-gap-repair
