name: Apply motion gap repair

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply motion patch
        run: python3 tools/apply_motion_gap_repair.py
      - name: Static audit
        run: |
          grep -Rni --include='*.kt' --include='*.xml' 'iphone' app/src/main && exit 1 || true
          grep -q 'MOTION_COMPENSATED' app/src/main/java/com/steadyvault/camera/processing/model/OptimizationModels.kt
          grep -q 'MOTION_FIELD_FRAGMENT_SHADER' app/src/main/java/com/steadyvault/camera/processing/transcode/HardwareVideoTranscoder.kt
          grep -q 'Interpolação com movimento' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit direct source
        run: |
          git config user.name 'matheusgsilva'
          git config user.email '49157527+matheusgsilva@users.noreply.github.com'
          git add app
          git commit -m 'adiciona reparo de gaps com compensacao de movimento'
          git push origin HEAD:test-1.8.131-motion-gap-repair
