name: Apply motion gap repair

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply motion patch
        run: |
          python3 tools/apply_motion_gap_repair.py
          python3 tools/apply_opencv_motion_upgrade.py
      - name: Static audit
        run: |
          if grep -Rni --include='*.kt' --include='*.xml' 'iphone' app/src/main; then exit 1; fi
          grep -q 'MOTION_COMPENSATED' app/src/main/java/com/steadyvault/camera/processing/model/OptimizationModels.kt
          grep -q 'OpenCvMotionEstimator' app/src/main/java/com/steadyvault/camera/processing/transcode/HardwareVideoTranscoder.kt
          grep -q 'calcOpticalFlowFarneback' app/src/main/java/com/steadyvault/camera/processing/motion/OpenCvMotionEstimator.kt
          grep -q 'org.opencv:opencv:4.10.0' app/build.gradle.kts
          grep -q 'Interpolação com movimento' app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
      - name: Compile and assemble APK
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon
      - name: Commit direct source
        run: |
          git config user.name 'matheusgsilva'
          git config user.email '49157527+matheusgsilva@users.noreply.github.com'
          git add app
          git commit -m 'adiciona reparo de gaps por fluxo optico'
          git push origin HEAD:test-1.8.131-motion-gap-repair
