name: Fix heavy video player

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-heavy-player.yml

permissions:
  contents: write

jobs:
  patch_build_commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply player fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activity_path = Path('app/src/main/java/com/steadyvault/camera/ui/vault/MediaPlayerActivity.kt')
          activity = activity_path.read_text(encoding='utf-8')
          old = '        videoView.setOnDismissListener(null)\n'
          new = '        videoView.setOnDismissListener { dismissToVault() }\n'
          if activity.count(old) != 1:
              raise SystemExit(f'callback de dismiss inesperado: {activity.count(old)}')
          activity_path.write_text(activity.replace(old, new, 1), encoding='utf-8')

          player_path = Path('app/src/main/java/com/steadyvault/camera/ui/gesture/ZoomableVideoView.kt')
          player = player_path.read_text(encoding='utf-8')
          old = '            val backBufferMs = if (highFrameRatePlayback) HIGH_FRAME_RATE_BACK_BUFFER_MS else BACK_BUFFER_MS\n'
          new = '            val backBufferMs = if (highFrameRatePlayback || demandingPlayback) HIGH_FRAME_RATE_BACK_BUFFER_MS else BACK_BUFFER_MS\n'
          if player.count(old) != 1:
              raise SystemExit(f'back buffer inesperado: {player.count(old)}')
          player = player.replace(old, new, 1)
          old = '                .setPrioritizeTimeOverSizeThresholdsForLocalPlayback(true)\n'
          new = '                .setPrioritizeTimeOverSizeThresholdsForLocalPlayback(false)\n'
          if player.count(old) != 1:
              raise SystemExit(f'política de buffer inesperada: {player.count(old)}')
          player_path.write_text(player.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify targeted changes
        run: |
          grep -F 'videoView.setOnDismissListener { dismissToVault() }' app/src/main/java/com/steadyvault/camera/ui/vault/MediaPlayerActivity.kt
          ! grep -F 'videoView.setOnDismissListener(null)' app/src/main/java/com/steadyvault/camera/ui/vault/MediaPlayerActivity.kt
          grep -F 'if (highFrameRatePlayback || demandingPlayback) HIGH_FRAME_RATE_BACK_BUFFER_MS else BACK_BUFFER_MS' app/src/main/java/com/steadyvault/camera/ui/gesture/ZoomableVideoView.kt
          grep -F '.setPrioritizeTimeOverSizeThresholdsForLocalPlayback(false)' app/src/main/java/com/steadyvault/camera/ui/gesture/ZoomableVideoView.kt

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated player fix
        run: |
          rm -f .github/workflows/fix-heavy-player.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'corrige player de videos pesados e gesto de fechar'
          git push origin HEAD:test-1.8.131-motion-gap-repair
