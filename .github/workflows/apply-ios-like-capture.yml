name: Apply iOS-like capture

on:
  push:
    branches: [test-1.8.131-ios-like-capture]
    paths:
      - '.github/workflows/apply-ios-like-capture.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-ios-like-capture
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply iOS-like capture patch
        run: python3 tools/apply_ios_like_capture.py

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit direct source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/steadyvault/camera/core/settings/CaptureSettings.kt app/src/main/java/com/steadyvault/camera/capture/timing/SensorCadencePolicy.kt app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt app/src/main/java/com/steadyvault/camera/ui/settings/SettingsActivity.kt
          git commit -m 'aproxima captura do modelo AVFoundation e restaura AE clean 30 60'
          git push origin HEAD:test-1.8.131-ios-like-capture
