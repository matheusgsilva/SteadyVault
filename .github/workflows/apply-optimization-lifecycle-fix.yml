name: Apply optimization lifecycle fix

on:
  push:
    branches:
      - test-1.8.131-optimization-lifecycle-fix
    paths:
      - tools/apply_optimization_lifecycle_fix.py

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-optimization-lifecycle-fix
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply lifecycle fix
        run: python3 tools/apply_optimization_lifecycle_fix.py
      - name: Validate lifecycle contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          auto = Path('app/src/main/java/com/steadyvault/camera/processing/auto/AutoGapRepairService.kt').read_text()
          manual = Path('app/src/main/java/com/steadyvault/camera/processing/service/VideoOptimizationService.kt').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          build = Path('app/build.gradle.kts').read_text()
          assert 'PROGRESS_PUBLISH_INTERVAL_MS = 300L' in auto
          assert 'START_REDELIVER_INTENT' in auto
          assert 'ensureForegroundStarted("Verificando fila de reparo…")' in auto
          assert 'now - lastPublishedAtMs >= PROGRESS_PUBLISH_INTERVAL_MS' in auto
          assert 'AutoGapRepairQueueStore.updateProgress' in auto
          assert 'android:name=".processing.auto.AutoGapRepairService"' in manifest and 'android:stopWithTask="false"' in manifest
          assert 'android:name=".processing.service.VideoOptimizationService"' in manifest
          manual_block = manifest.split('android:name=".processing.service.VideoOptimizationService"', 1)[1].split('/>', 1)[0]
          assert 'android:stopWithTask="false"' in manual_block
          assert 'return if (intent?.action == ACTION_START) START_REDELIVER_INTENT else START_NOT_STICKY' in manual
          assert 'versionCode = 1000149' in build
          print('Lifecycle contract OK')
          PY
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit validated fix and remove temporary files
        run: |
          rm -f tools/apply_optimization_lifecycle_fix.py .github/workflows/apply-optimization-lifecycle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "corrige estabilidade da otimizacao em segundo plano"
            git push origin HEAD:test-1.8.131-optimization-lifecycle-fix
          fi
