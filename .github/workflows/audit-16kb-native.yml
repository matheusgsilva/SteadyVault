name: Audit Android 16 KB native libs

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Audit ELF LOAD alignment and APK zip alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/apk16 && mkdir -p /tmp/apk16
          unzip -q "$APK" 'lib/*' -d /tmp/apk16
          echo '===== ELF 16 KB AUDIT ====='
          bad=0
          checked=0
          non_elf=0
          while IFS= read -r so; do
            rel=${so#/tmp/apk16/}
            abi=$(echo "$rel" | cut -d/ -f2)
            if [[ "$abi" != "arm64-v8a" && "$abi" != "x86_64" ]]; then
              continue
            fi
            magic=$(od -An -tx1 -N4 "$so" | tr -d ' \n')
            if [[ "$magic" != "7f454c46" ]]; then
              echo "NON_ELF   $rel"
              non_elf=$((non_elf+1))
              continue
            fi
            checked=$((checked+1))
            aligns=$(readelf -lW "$so" | awk '$1=="LOAD" {print $NF}')
            file_bad=0
            for a in $aligns; do
              value=$((a))
              if (( value < 16384 )); then file_bad=1; fi
            done
            if (( file_bad )); then
              echo "UNALIGNED $rel LOAD_ALIGN=[$(echo $aligns | tr '\n' ' ')]"
              bad=$((bad+1))
            else
              echo "ALIGNED   $rel LOAD_ALIGN=[$(echo $aligns | tr '\n' ' ')]"
            fi
          done < <(find /tmp/apk16/lib -type f -name '*.so' | sort)
          echo "ELF_CHECKED_COUNT=$checked"
          echo "NON_ELF_WRAPPER_COUNT=$non_elf"
          echo "ELF_UNALIGNED_COUNT=$bad"
          echo '===== ZIPALIGN 16 KB AUDIT ====='
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" || echo 'ZIPALIGN_16KB_CHECK_FAILED (native libs are extracted at install because extractNativeLibs=true)'
          if (( bad > 0 )); then
            echo "16 KB ELF audit failed: $bad unaligned 64-bit native libraries"
            exit 1
          fi
          echo '16 KB ELF audit passed: all 64-bit ELF LOAD segments are >= 0x4000'
