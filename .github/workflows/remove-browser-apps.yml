name: Remove browser and protected apps

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/remove-browser-apps.yml
      - tools/remove_browser_apps.py

permissions:
  contents: write

jobs:
  cleanup_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove browser and protected apps cleanly
        run: python3 tools/remove_browser_apps.py

      - name: Verify removed feature references
        run: |
          ! grep -R -n -E 'ui\.browser|ui\.apps|PrivateBrowser|ProtectedApps|AppVaultLock|VaultScreenCaptureService|navBrowser|navApps|ic_nav_browser|ic_nav_apps|activity_private_browser|activity_protected_apps|item_protected_app|share_link_browser_label|SocialDownloads|sv_cookies_|youtubedl-android|androidx\.webkit:webkit|FOREGROUND_SERVICE_MEDIA_PROJECTION|SYSTEM_ALERT_WINDOW' app/src app/build.gradle.kts
          test ! -e app/src/main/java/com/steadyvault/camera/storage/security/AppVaultLock.kt
          test ! -e app/src/main/java/com/steadyvault/camera/storage/security/ProtectedAppsStore.kt
          test ! -e app/src/main/java/com/steadyvault/camera/storage/security/ProtectedAppsIndexStore.kt

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated cleanup
        run: |
          rm -f .github/workflows/remove-browser-apps.yml tools/remove_browser_apps.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'remove navegador e aba de apps protegidos'
          git push origin HEAD:test-1.8.131-motion-gap-repair
