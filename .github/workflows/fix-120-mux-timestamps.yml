name: Fix 120 FPS mux timestamps

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-120-mux-timestamps.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply 120 FPS timestamp fix
        run: python3 tools/fix_120_mux_timestamps.py

      - name: Verify scope
        run: |
          grep -F 'normalize120IfBatched(finalFile)' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -F 'object HighSpeedTimestampNormalizer' app/src/main/java/com/steadyvault/camera/capture/recorder/HighSpeedTimestampNormalizer.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/src/main/java/com/steadyvault/camera/capture/recorder/HighSpeedTimestampNormalizer.kt app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt | sort)"
          test "$changed" = "$expected"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-120-mux-timestamps.yml tools/fix_120_mux_timestamps.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'normaliza timestamps do 120 fps sem criar quadros'
          git push origin HEAD:test-1.8.131-motion-gap-repair
