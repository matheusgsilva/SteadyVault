name: SteadyVault 1.8.131 AE60 CLEAN

on:
  push:
    branches: [test-1.8.131-ae60-clean-redownload]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AE60 clean patch
        run: python3 tools/apply_131_test_fixes.py
      - name: Audit
        run: |
          grep -q 'session.setRepeatingRequest(request, null, mainHandler)' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'CONTROL_AE_TARGET_FPS_RANGE, profile.fpsRange' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          ! grep -q 'CaptureExposureFpsTrace' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -q 'support != Support.UNSUPPORTED' app/src/main/java/com/steadyvault/camera/core/capability/HardwareSupportPolicy.kt
          grep -q 'source != Source.UNAVAILABLE' app/src/main/java/com/steadyvault/camera/core/capability/CaptureModeCatalog.kt
          grep -q 'versionName = "1.8.131"' app/build.gradle.kts
          grep -q 'versionCode = 1000134' app/build.gradle.kts
          git diff --check
          echo STATIC_AUDIT_OK
      - name: Package source
        run: |
          rm -rf .git
          zip -qr /tmp/SteadyVault_1.8.131_AE60_CLEAN.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: SteadyVault_1.8.131_AE60_CLEAN
          path: /tmp/SteadyVault_1.8.131_AE60_CLEAN.zip
          if-no-files-found: error
