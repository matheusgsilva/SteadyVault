name: Fix high FPS capture defects

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/fix-highfps-capture-defects.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply high FPS fixes
        run: python3 tools/fix_highfps_capture_defects.py

      - name: Verify scope and behavior
        run: |
          grep -F 'get() = selectedProfile != null && (hdrHlg10 || targetFps >= 240)' app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt
          grep -F 'setVideoFrameRate(targetFps)' app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt
          grep -F 'CONTROL_AE_ANTIBANDING_MODE' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt | sort)"
          test "$changed" = "$expected"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated fix
        run: |
          rm -f .github/workflows/fix-highfps-capture-defects.yml tools/fix_highfps_capture_defects.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'corrige cadencia 120 fps e antibanding high-speed'
          git push origin HEAD:test-1.8.131-motion-gap-repair
