name: Restore proven iOS-like 60 FPS path

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/restore-ios-like-60fps.yml

permissions:
  contents: write

jobs:
  restore_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore proven 60 FPS recorder behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          recorder_path = Path('app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt')
          recorder = recorder_path.read_text()

          old = 'selectedProfile != null && (hdrHlg10 || targetFps >= 60)'
          new = 'selectedProfile != null && (hdrHlg10 || targetFps >= 120)'
          assert recorder.count(old) == 1, f'usesExactOemProfile expected once, found {recorder.count(old)}'
          recorder = recorder.replace(old, new)

          old = 'oemProfile != null && (hdrHlg10 || targetFps >= 60)'
          new = 'oemProfile != null && (hdrHlg10 || targetFps >= 120)'
          assert recorder.count(old) == 1, f'useOemProfile expected once, found {recorder.count(old)}'
          recorder = recorder.replace(old, new)
          recorder_path.write_text(recorder)

          capture_path = Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt')
          capture = capture_path.read_text()
          old_revision = 'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-clean-1.8.258-oem60"'
          new_revision = 'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-clean-1.8.259"'
          assert capture.count(old_revision) == 1, 'current OEM60 pipeline revision not found exactly once'
          capture = capture.replace(old_revision, new_revision)
          capture_path.write_text(capture)
          PY

      - name: Verify exact proven iOS-like 60 FPS baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          proven = '7de562cedf2311f667728b10028492bfaa0c483d'

          current_recorder = Path('app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt').read_text()
          proven_recorder = subprocess.check_output([
              'git', 'show', f'{proven}:app/src/main/java/com/steadyvault/camera/capture/recorder/DirectMediaRecorderBackend.kt'
          ], text=True)
          assert current_recorder == proven_recorder, '60 FPS recorder no longer matches the proven iOS-like baseline'

          current_capture = Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt').read_text()
          proven_capture = subprocess.check_output([
              'git', 'show', f'{proven}:app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt'
          ], text=True)

          current_capture_normalized = current_capture.replace(
              'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-clean-1.8.259"',
              'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-clean-1.8.257"'
          )
          assert current_capture_normalized == proven_capture, 'Camera2 capture path differs from the proven iOS-like baseline'
          PY

          # Do not touch interpolation/repair or the lock-screen corner fix.
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/widgets/WidgetAppearance.kt)"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated restore
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-ios-like-60fps.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'restaura padrão iOS-like nos 60 fps'
          git push origin HEAD:test-1.8.131-motion-gap-repair
