name: Cleanup optimization lifecycle fix

on:
  push:
    branches:
      - test-1.8.131-optimization-lifecycle-fix
    paths:
      - .github/workflows/cleanup-optimization-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-optimization-lifecycle-fix
      - name: Restore original wrapper mode and remove this workflow
        run: |
          git update-index --chmod=-x gradlew
          rm -f .github/workflows/cleanup-optimization-lifecycle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "limpa validacao temporaria da otimizacao"
          git push origin HEAD:test-1.8.131-optimization-lifecycle-fix
