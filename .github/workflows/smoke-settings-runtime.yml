name: Smoke Settings Runtime

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated Robolectric smoke tests
        shell: bash
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              testOptions {
                  unitTests.isIncludeAndroidResources = true
              }
          }

          dependencies {
              testImplementation("org.robolectric:robolectric:4.16.1")
          }
          EOF
          # O repositorio tem testes legados de classes removidas. Para este smoke
          # de UI, isole apenas os cenarios que queremos validar sem alterar o repo.
          rm -rf app/src/test/java
          mkdir -p app/src/test/java/com/steadyvault/camera/ui/settings
          cat > app/src/test/java/com/steadyvault/camera/ui/settings/SettingsActivitySmokeTest.kt <<'EOF'
          package com.steadyvault.camera.ui.settings

          import android.content.Context
          import android.content.Intent
          import android.widget.TextView
          import com.steadyvault.camera.R
          import com.steadyvault.camera.ui.navigation.BottomNavigation
          import org.junit.After
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.Robolectric
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.RuntimeEnvironment
          import org.robolectric.annotation.Config

          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [35])
          class SettingsActivitySmokeTest {
              private val context: Context
                  get() = RuntimeEnvironment.getApplication()

              @After
              fun cleanup() {
                  listOf(
                      "steadyvault_capture_settings",
                      "steadyvault_camera_profiles",
                      "steadyvault_hardware_capabilities"
                  ).forEach { name ->
                      context.getSharedPreferences(name, Context.MODE_PRIVATE).edit().clear().commit()
                  }
              }

              private fun openSettings() =
                  Robolectric.buildActivity(
                      SettingsActivity::class.java,
                      Intent(context, SettingsActivity::class.java)
                  ).create().start().resume().visible()

              @Test
              fun opensWithDefaultSettings() {
                  val controller = openSettings()
                  assertFalse(controller.get().isFinishing)
                  controller.pause().stop().destroy()
              }

              @Test
              fun opensWithStaleButTypedValues() {
                  context.getSharedPreferences("steadyvault_capture_settings", Context.MODE_PRIVATE).edit()
                      .putInt("fps", 999)
                      .putString("resolution", "INVALID")
                      .putString("resolution_60", "INVALID")
                      .putString("codec", "OLD_CODEC")
                      .putString("stabilization", "OLD_STAB")
                      .putString("color_profile", "OLD_COLOR")
                      .putString("selected_camera_id", "camera-that-does-not-exist")
                      .commit()
                  val controller = openSettings()
                  assertFalse(controller.get().isFinishing)
                  controller.pause().stop().destroy()
              }

              @Test
              fun wrongPreferenceTypeFallsBackToRecoveryInsteadOfClosing() {
                  context.getSharedPreferences("steadyvault_capture_settings", Context.MODE_PRIVATE).edit()
                      .putString("fps", "valor-corrompido")
                      .commit()
                  val controller = openSettings()
                  val activity = controller.get()
                  assertFalse(activity.isFinishing)
                  val root = activity.findViewById<android.view.ViewGroup>(R.id.settingsContainer)
                  val texts = mutableListOf<String>()
                  fun collect(view: android.view.View) {
                      if (view is TextView) texts += view.text.toString()
                      if (view is android.view.ViewGroup) {
                          for (i in 0 until view.childCount) collect(view.getChildAt(i))
                      }
                  }
                  collect(root)
                  assertTrue(texts.any { it.contains("Tentar abrir configurações novamente") })
                  controller.pause().stop().destroy()
              }

              @Test
              fun navigationCallbackFailureDoesNotCloseSettings() {
                  val controller = openSettings()
                  val activity = controller.get()
                  BottomNavigation.bind(
                      activity = activity,
                      currentTab = BottomNavigation.TAB_SETTINGS,
                      onBeforeNavigate = { error("falha simulada antes da navegacao") }
                  )
                  activity.findViewById<TextView>(R.id.navLibrary).performClick()
                  assertFalse(activity.isFinishing)
                  controller.pause().stop().destroy()
              }
          }
          EOF
      - name: Run Settings runtime smoke
        run: bash ./gradlew :app:testDebugUnitTest --tests 'com.steadyvault.camera.ui.settings.SettingsActivitySmokeTest' --no-daemon --stacktrace
