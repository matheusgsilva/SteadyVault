name: AE auto 60 FPS

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/ae-auto-60fps.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply AE auto patch
        run: python3 tools/ae_auto_60fps.py

      - name: Verify capture contract
        run: |
          grep -F 'CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -F 'CONTROL_AE_TARGET_FPS_RANGE, profile.fpsRange' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          grep -F 'ios-like-ae-auto60-1.8.260' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated change
        run: |
          rm -f .github/workflows/ae-auto-60fps.yml tools/ae_auto_60fps.py tools/ae_auto_60fps.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'mantem AE automatico nos 60 fps'
          git push origin HEAD:test-1.8.131-motion-gap-repair
