name: AE auto 60 FPS

on:
  push:
    branches:
      - test-1.8.131-motion-gap-repair
    paths:
      - .github/workflows/ae-auto-60fps.yml

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test-1.8.131-motion-gap-repair
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep AE automatic for regular 60 FPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt')
          text = path.read_text()

          old = '''        runCatching {
            armRecorderForFirstFrame(token)
            val manualSensor = supportsManualSensor(profile)
            if (
                !recordingSettings.autoFpsLowLight &&
                profile.targetFps == CaptureModeStore.FPS_60 &&
                !profile.hdrHlg10 &&
                manualSensor
            ) {
                // Caminho AE60 CLEAN medido como o mais estável no S25 Ultra.
                // 30 FPS nunca entra aqui. Não existe warm-up especial do widget.
                val recent = Camera3AStateStore.recentExposure(profile.cameraId)
                val immediatePlan = recent?.let {
                    fixedCadencePlan(profile, it.exposureTimeNs, it.sensitivityIso)
                }
                if (immediatePlan != null) {
                    val fixedRequest = buildFixedCadenceRequest(profile, immediatePlan)
                        ?: throw IllegalStateException("câmera não disponível para request de cadência fixa")
                    session.setRepeatingRequest(fixedRequest, null, mainHandler)
                    commitRecorderStart(profile, token, highSpeed = false)
                } else {
                    startWithFixedSensorCadence(session, request, profile, token)
                }
            } else {
                // 30 FPS e Auto FPS seguem AE contínuo, como o comportamento do AVFoundation.
                session.setRepeatingRequest(request, null, mainHandler)
                commitRecorderStart(profile, token, highSpeed = false)
            }
        }.onFailure {
'''
          new = '''        runCatching {
            armRecorderForFirstFrame(token)
            // Gravação regular usa um único request durante toda a captura.
            // Em 60 FPS com Auto FPS desligado, resolveStandardFpsRange() entrega
            // exatamente [60,60]. O AE permanece ligado para ajustar exposição/ISO,
            // sem trocar para SENSOR_FRAME_DURATION/ISO manual depois que o MP4 começou.
            // Isso evita a transição AE -> sensor manual observada no início dos raws.
            session.setRepeatingRequest(request, null, mainHandler)
            commitRecorderStart(profile, token, highSpeed = false)
        }.onFailure {
'''
          assert text.count(old) == 1, 'startStabilizedRecording baseline not found exactly once'
          text = text.replace(old, new)

          old_revision = 'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-clean-1.8.259"'
          new_revision = 'private const val CAPTURE_PIPELINE_REVISION = "ios-like-ae-auto60-1.8.260"'
          assert text.count(old_revision) == 1, 'pipeline revision baseline not found exactly once'
          text = text.replace(old_revision, new_revision)

          path.write_text(text)
          PY

      - name: Verify 60 FPS contract and repair untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'return exact' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt >/dev/null
          grep -F 'setSafely(builder, CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt >/dev/null
          grep -F 'setSafely(builder, CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, profile.fpsRange)' app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt >/dev/null
          test -z "$(git diff --name-only -- app/src/main/java/com/steadyvault/camera/processing)"
          changed=$(git diff --name-only -- app/src/main/java)
          test "$changed" = 'app/src/main/java/com/steadyvault/camera/capture/service/CaptureService.kt'

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ae-auto-60fps.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'mantem AE automatico nos 60 fps'
          git push origin HEAD:test-1.8.131-motion-gap-repair
